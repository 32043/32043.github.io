<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Search & Player</title>
    <style>
        /* YouTubeっぽいダークテーマのデザイン */
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* ヘッダー固定 */
        header {
            position: sticky;
            top: 0;
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            z-index: 100;
            gap: 10px;
        }

        .search-box {
            display: flex;
            width: 100%;
            max-width: 600px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #1c62b9;
        }

        button {
            padding: 0 20px;
            background-color: #222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background-color: #272727;
        }

        button img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            filter: invert(1);
        }

        /* チャンネル絞り込みフィルターエリア */
        #filter-container {
            display: none; /* 検索前は非表示 */
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            gap: 8px;
        }

        .filter-chip {
            background-color: #272727;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
            margin-right: 8px;
            transition: background 0.2s;
        }

        .filter-chip:hover, .filter-chip.active {
            background-color: #f1f1f1;
            color: #0f0f0f;
        }

        /* メインコンテンツエリア */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* プレイヤーエリア */
        #player-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 動画グリッド（3列） */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .video-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: scale(1.02);
        }

        .video-card img.thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
        }

        .video-info {
            padding: 12px;
            display: flex;
            gap: 10px;
        }

        /* チャンネルの簡易イニシャルアイコン風表示 */
        .channel-avatar {
            width: 36px;
            height: 36px;
            background-color: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            color: #aaa;
            flex-shrink: 0;
        }

        .video-text-meta {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            margin: 0 0 4px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #f1f1f1;
        }

        .video-channel {
            font-size: 12px;
            color: #aaa;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .placeholder-text {
            text-align: center;
            color: #777;
            grid-column: span 3;
            padding: 40px;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="検索">
            <button id="search-button">
                <img src="public/assets/img/650.png" alt="検索">
            </button>
        </div>
        <!-- 検索結果のチャンネル絞り込み用チップが表示される場所 -->
        <div id="filter-container"></div>
    </header>

    <main>
        <div id="player-container"></div>
        <div id="results-grid" class="grid-container">
            <div class="placeholder-text">キーワードを入力して検索してください</div>
        </div>
    </main>

    <script>
        const API_KEY = 'AIzaSyC78z1x-dM3Ve82Wq8hItzIC6BbESNxbhE';

        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const resultsGrid = document.getElementById('results-grid');
        const playerContainer = document.getElementById('player-container');
        const filterContainer = document.getElementById('filter-container');

        let allFetchedVideos = []; // 取得した全動画データを保持する変数
        let currentFilterChannel = 'ALL'; // 現在の絞り込み

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        async function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsGrid.innerHTML = '<div class="placeholder-text">検索中...</div>';
            filterContainer.style.display = 'none';

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}&maxResults=20`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    alert('エラー: ' + data.error.message);
                    resultsGrid.innerHTML = '<div class="placeholder-text">エラーが発生しました</div>';
                    return;
                }

                allFetchedVideos = data.items || [];
                currentFilterChannel = 'ALL';

                createChannelFilters(allFetchedVideos);
                displayVideos(allFetchedVideos);

            } catch (err) {
                console.error(err);
                alert('通信に失敗しました。');
            }
        }

        // 検索結果に含まれるチャンネル名のリストを作ってボタン（チップ）として配置する
        function createChannelFilters(items) {
            filterContainer.innerHTML = '';
            if (!items || items.length === 0) {
                filterContainer.style.display = 'none';
                return;
            }

            // 重複のないチャンネル名のセットを作る
            const channels = ['ALL', ...new Set(items.map(item => item.snippet.channelTitle))];

            channels.forEach(channel => {
                const btn = document.createElement('button');
                btn.className = `filter-chip ${channel === 'ALL' ? 'active' : ''}`;
                btn.textContent = channel === 'ALL' ? 'すべて' : channel;

                btn.addEventListener('click', () => {
                    // アクティブ状態の切り替え
                    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    currentFilterChannel = channel;
                    filterAndDisplayVideos();
                });

                filterContainer.appendChild(btn);
            });

            filterContainer.style.display = 'flex';
        }

        // 選択されたチャンネルで絞り込んで表示する
        function filterAndDisplayVideos() {
            let filtered = allFetchedVideos;
            if (currentFilterChannel !== 'ALL') {
                filtered = allFetchedVideos.filter(item => item.snippet.channelTitle === currentFilterChannel);
            }
            displayVideos(filtered);
        }

        function displayVideos(items) {
            resultsGrid.innerHTML = '';

            if (!items || items.length === 0) {
                resultsGrid.innerHTML = '<div class="placeholder-text">該当する動画が見つかりませんでした</div>';
                return;
            }

            items.forEach(item => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const channelTitle = item.snippet.channelTitle;
                const thumbnail = item.snippet.thumbnails.medium.url;

                // チャンネル名の頭文字をアイコン風に表示する
                const initial = channelTitle.charAt(0).toUpperCase();

                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <img class="thumb" src="${thumbnail}" alt="${title}">
                    <div class="video-info">
                        <div class="channel-avatar">${initial}</div>
                        <div class="video-text-meta">
                            <p class="video-title">${title}</p>
                            <p class="video-channel">${channelTitle}</p>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    playerContainer.innerHTML = `
                        <div class="video-wrapper">
                            <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                                title="YouTube video player" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    `;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                resultsGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
