<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Search & Player (Supabase Sync)</title>
    <!-- Supabase クライアントライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            position: sticky;
            top: 0;
            background-color: #0f0f0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #222;
            z-index: 100;
            gap: 10px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .search-box {
            display: flex;
            flex: 1;
            max-width: 600px;
        }
        .api-setting-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #1a1a1a;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        .api-setting-box input {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 12px;
            outline: none;
            width: 130px;
        }
        .api-setting-box button {
            padding: 4px 10px;
            border-radius: 12px;
            background-color: #333;
            border: none;
            font-size: 11px;
            color: #fff;
            cursor: pointer;
        }
        .quota-status {
            font-size: 12px;
            color: #aaa;
            background-color: #1a1a1a;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #333;
        }
        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 10px 15px;
            background-color: #121212;
            border: 1px solid #303030;
            border-radius: 40px 0 0 40px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .search-btn {
            padding: 0 20px;
            background-color: #222;
            border: 1px solid #303030;
            border-left: none;
            border-radius: 0 40px 40px 0;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #filter-container {
            display: none;
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
            gap: 8px;
        }
        .filter-chip {
            background-color: #272727;
            color: #fff;
            border: none;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
            margin-right: 8px;
        }
        .filter-chip.active {
            background-color: #f1f1f1;
            color: #0f0f0f;
        }
        main {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        #watch-container {
            display: none;
            grid-template-columns: 1fr 400px;
            gap: 24px;
            margin-bottom: 40px;
        }
        .watch-left { display: flex; flex-direction: column; }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-wrapper iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }
        .watch-title { font-size: 18px; font-weight: 600; margin: 14px 0 8px 0; color: #f1f1f1; }
        .watch-channel-info { font-size: 14px; color: #aaa; margin-bottom: 16px; }
        .watch-right-comments {
            background-color: #181818; border: 1px solid #282828; border-radius: 12px;
            padding: 16px; max-height: 550px; overflow-y: auto; display: flex; flex-direction: column;
        }
        .comments-header { font-size: 16px; font-weight: bold; margin-bottom: 14px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .comment-item { margin-bottom: 14px; font-size: 13px; }
        .comment-author { font-weight: bold; color: #f1f1f1; margin-bottom: 3px; }
        .comment-text { color: #ccc; margin: 0; word-break: break-all; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .video-card { background-color: #1f1f1f; border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .video-card img.thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
        .video-info { padding: 12px; display: flex; gap: 10px; }
        .channel-avatar { width: 36px; height: 36px; background-color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #aaa; flex-shrink: 0; }
        .video-text-meta { display: flex; flex-direction: column; overflow: hidden; }
        .video-title { font-size: 14px; font-weight: 500; margin: 0 0 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: #f1f1f1; }
        .video-channel { font-size: 12px; color: #aaa; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .placeholder-text { text-align: center; color: #777; grid-column: span 3; padding: 40px; }
        @media (max-width: 900px) {
            #watch-container { grid-template-columns: 1fr; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="検索 または YouTubeのリンクをペースト">
                <button class="search-btn" id="search-button">
                    <img src="public/assets/img/650.png" alt="検索" style="width:20px;height:20px;filter:invert(1);">
                </button>
            </div>

            <div class="api-setting-box">
                <input type="password" id="custom-api-key" placeholder="APIキー変更">
                <button id="save-key-btn">設定</button>
            </div>

            <div class="quota-status" id="quota-display">
                残り枠: 同期中...
            </div>
        </div>
        <div id="filter-container"></div>
    </header>

    <main>
        <div id="watch-container">
            <div class="watch-left">
                <div class="video-wrapper" id="player-wrapper"></div>
                <div class="watch-title" id="watch-title"></div>
                <div class="watch-channel-info" id="watch-channel"></div>
            </div>
            <div class="watch-right-comments" id="comments-box">
                <div class="comments-header">コメント</div>
                <div id="comments-list">読み込み中...</div>
            </div>
        </div>

        <div id="results-grid" class="grid-container">
            <div class="placeholder-text">キーワードを入力、またはYouTubeのリンクを貼り付けてください</div>
        </div>
    </main>

    <script>
        // Supabase の接続情報（入力いただいた値を設定済み）
        const SUPABASE_URL = 'https://ocdsoyiwtrmszhrxunlp.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_pCr70-GWTlUqTgztEy3etw_xdXa3Fta';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const apiKeys = [
            'AIzaSyDAzdoUdu5dbttA45r2L3DDUoK-3dsclzo',
            'AIzaSyClEDJSaDPk_Y76JH1xDxKd7vA2Bra_d24',
            'AIzaSyDgu8NNPC9UJtYF6fvupEvLMa6sJJmqaKI'
        ];

        let activeApiKey = localStorage.getItem('youtube_custom_api_key') || apiKeys[0];
        let currentUsedQuota = 0;
        const MAX_QUOTA = 10000;

        // Supabaseから現在のAPIキーの消費量を取得する
        async function fetchQuotaFromSupabase() {
            const { data, error } = await supabaseClient
                .from('api_quotas')
                .select('used_quota')
                .eq('api_key', activeApiKey)
                .single();

            if (data) {
                currentUsedQuota = data.used_quota;
            } else {
                // データがなければ新規登録
                await supabaseClient.from('api_quotas').insert([{ api_key: activeApiKey, used_quota: 0 }]);
                currentUsedQuota = 0;
            }
            updateQuotaDisplay();
        }

        // Supabaseの消費量を更新する
        async function consumeQuota(amount) {
            currentUsedQuota += amount;
            updateQuotaDisplay();

            // Supabase側のデータをUPSERT（存在すれば更新、なければ挿入）
            await supabaseClient
                .from('api_quotas')
                .upsert({ api_key: activeApiKey, used_quota: currentUsedQuota, updated_at: new Date() }, { onConflict: 'api_key' });
        }

        function updateQuotaDisplay() {
            const remaining = Math.max(0, MAX_QUOTA - currentUsedQuota);
            document.getElementById('quota-display').textContent = `残り枠: 約 ${remaining} / ${MAX_QUOTA}`;
        }

        // 初期化時にSupabaseからクォータを取得
        fetchQuotaFromSupabase();

        // APIキー変更時の処理
        document.getElementById('save-key-btn').addEventListener('click', async () => {
            const newKey = document.getElementById('custom-api-key').value.trim();
            if (newKey) {
                activeApiKey = newKey;
                localStorage.setItem('youtube_custom_api_key', newKey);
                document.getElementById('custom-api-key').value = '';
                await fetchQuotaFromSupabase();
                alert('APIキーを切り替えました！');
            } else {
                alert('有効なAPIキーを入力してください');
            }
        });

        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const resultsGrid = document.getElementById('results-grid');
        const watchContainer = document.getElementById('watch-container');
        const playerWrapper = document.getElementById('player-wrapper');
        const watchTitle = document.getElementById('watch-title');
        const watchChannel = document.getElementById('watch-channel');
        const commentsList = document.getElementById('comments-list');
        const filterContainer = document.getElementById('filter-container');

        let allFetchedVideos = [];
        let currentFilterChannel = 'ALL';

        searchButton.addEventListener('click', handleInput);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleInput();
        });

        function extractYouTubeVideoId(input) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = input.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function handleInput() {
            const inputVal = searchInput.value.trim();
            if (!inputVal) return;

            const videoId = extractYouTubeVideoId(inputVal);
            if (videoId) {
                playVideoDirectly(videoId, inputVal);
            } else {
                performSearch(inputVal);
            }
        }

        function playVideoDirectly(videoId, urlText) {
            filterContainer.style.display = 'none';
            resultsGrid.innerHTML = '';
            watchContainer.style.display = 'grid';

            playerWrapper.innerHTML = `
                <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="YouTube video player" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            watchTitle.textContent = `直リンク再生 (${urlText})`;
            watchChannel.textContent = '直接入力されたURL';

            fetchComments(videoId);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function performSearch(query) {
            resultsGrid.innerHTML = '<div class="placeholder-text">検索中...</div>';
            filterContainer.style.display = 'none';

            await consumeQuota(100);

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&key=${activeApiKey}&maxResults=20`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    alert('エラー: ' + data.error.message);
                    resultsGrid.innerHTML = '<div class="placeholder-text">エラーが発生しました（APIキーの制限や上限をご確認ください）</div>';
                    return;
                }

                allFetchedVideos = data.items || [];
                currentFilterChannel = 'ALL';

                createChannelFilters(allFetchedVideos);
                displayVideos(allFetchedVideos);

            } catch (err) {
                console.error(err);
                alert('通信に失敗しました。');
            }
        }

        function createChannelFilters(items) {
            filterContainer.innerHTML = '';
            if (!items || items.length === 0) {
                filterContainer.style.display = 'none';
                return;
            }

            const channels = ['ALL', ...new Set(items.map(item => item.snippet.channelTitle))];

            channels.forEach(channel => {
                const btn = document.createElement('button');
                btn.className = `filter-chip ${channel === 'ALL' ? 'active' : ''}`;
                btn.textContent = channel === 'ALL' ? 'すべて' : channel;

                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilterChannel = channel;
                    filterAndDisplayVideos();
                });

                filterContainer.appendChild(btn);
            });

            filterContainer.style.display = 'flex';
        }

        function filterAndDisplayVideos() {
            let filtered = allFetchedVideos;
            if (currentFilterChannel !== 'ALL') {
                filtered = allFetchedVideos.filter(item => item.snippet.channelTitle === currentFilterChannel);
            }
            displayVideos(filtered);
        }

        function displayVideos(items) {
            resultsGrid.innerHTML = '';

            if (!items || items.length === 0) {
                resultsGrid.innerHTML = '<div class="placeholder-text">該当する動画が見つかりませんでした</div>';
                return;
            }

            items.forEach(item => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const channelTitle = item.snippet.channelTitle;
                const thumbnail = item.snippet.thumbnails.medium.url;
                const initial = channelTitle.charAt(0).toUpperCase();

                const card = document.createElement('div');
                card.className, 'video-card';
                card.className = 'video-card';
                card.innerHTML = `
                    <img class="thumb" src="${thumbnail}" alt="${title}">
                    <div class="video-info">
                        <div class="channel-avatar">${initial}</div>
                        <div class="video-text-meta">
                            <p class="video-title">${title}</p>
                            <p class="video-channel">${channelTitle}</p>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    watchContainer.style.display = 'grid';
                    playerWrapper.innerHTML = `
                        <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                            title="YouTube video player" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                        </iframe>
                    `;
                    watchTitle.textContent = title;
                    watchChannel.textContent = channelTitle;

                    fetchComments(videoId);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });

                resultsGrid.appendChild(card);
            });
        }

        async function fetchComments(videoId) {
            commentsList.innerHTML = '<div style="color: #888; font-size: 13px;">コメントを読み込み中...</div>';
            await consumeQuota(1);

            const commentUrl = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${videoId}&key=${activeApiKey}&maxResults=15`;

            try {
                const response = await fetch(commentUrl);
                const data = await response.json();

                if (data.error || !data.items || data.items.length === 0) {
                    commentsList.innerHTML = '<div style="color: #888; font-size: 13px;">この動画にはコメントがないか、無効化されています。</div>';
                    return;
                }

                commentsList.innerHTML = '';
                data.items.forEach(item => {
                    const commentSnippet = item.snippet.topLevelComment.snippet;
                    const author = commentSnippet.authorDisplayName;
                    const text = commentSnippet.textDisplay;

                    const commentDiv = document.createElement('div');
                    commentDiv.className = 'comment-item';
                    commentDiv.innerHTML = `
                        <div class="comment-author">${author}</div>
                        <div class="comment-text">${text}</div>
                    `;
                    commentsList.appendChild(commentDiv);
                });

            } catch (err) {
                console.error(err);
                commentsList.innerHTML = '<div style="color: #888; font-size: 13px;">コメントの取得に失敗しました。</div>';
            }
        }
    </script>
</body>
</html>
