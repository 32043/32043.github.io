<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Custom Proxy Browser</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            display: flex;
            padding: 10px;
            background: #2c2c2c;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #444;
            border-radius: 4px;
            background: #1e1e1e;
            color: #fff;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        button {
            padding: 8px 16px;
            font-size: 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0056b3;
        }
        .secondary-btn {
            background: #444;
        }
        .secondary-btn:hover {
            background: #555;
        }
        iframe {
            flex: 1;
            width: 100%;
            border: none;
            background: white;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="secondary-btn" onclick="goBack()">←</button>
        <button class="secondary-btn" onclick="goForward()">→</button>
        <button class="secondary-btn" onclick="reloadPage()">↻</button>
        <input type="text" id="urlInput" placeholder="URLまたはGoogle検索ワードを入力してEnter..." onkeypress="handleKeyPress(event)">
        <button onclick="loadPage()">検索・移動</button>
        <button class="secondary-btn" onclick="openInBlank()">about:blankで隠す</button>
    </div>

    <iframe id="viewer"></iframe>

    <script>
        // ご自身のRenderバックエンドのURL
        const RENDER_PROXY_URL = 'https://browser-32043.onrender.com/proxy?url=';

        function loadPage() {
            let inputVal = document.getElementById('urlInput').value.trim();
            if (!inputVal) return;

            let targetUrl = inputVal;

            // 入力値がURL形式か、検索キーワードかを判定する
            if (inputVal.startsWith('http://') || inputVal.startsWith('https://')) {
                targetUrl = inputVal;
            } else if (inputVal.includes('.') && !inputVal.includes(' ')) {
                // ドメインっぽい文字列（例: example.com）ならhttpsを補う
                targetUrl = 'https://' + inputVal;
            } else {
                // それ以外はすべてGoogle検索のURLに変換する
                targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(inputVal);
            }

            // プロキシ経由でiframeに読み込ませる
            document.getElementById('viewer').src = RENDER_PROXY_URL + encodeURIComponent(targetUrl);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                loadPage();
            }
        }

        function goBack() {
            try {
                document.getElementById('viewer').contentWindow.history.back();
            } catch(e) {}
        }

        function goForward() {
            try {
                document.getElementById('viewer').contentWindow.history.forward();
            } catch(e) {}
        }

        function reloadPage() {
            let iframe = document.getElementById('viewer');
            iframe.src = iframe.src;
        }

        function openInBlank() {
            let win = window.open('about:blank');
            if (!win) {
                alert('ポップアップがブロックされました。');
                return;
            }
            let doc = win.document;
            doc.open();
            doc.write(document.documentElement.outerHTML);
            doc.close();
        }
    </script>
</body>
</html>
